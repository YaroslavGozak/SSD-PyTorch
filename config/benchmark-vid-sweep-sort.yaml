# Batch tracker sweep for tools.benchmarks.batch_benchmark_vid
# Base benchmark config (model, dataset, output path) is passed via CLI.

sweep_name: "tracker_param_sweep_v1"

experiments:
  - name: "sort_0"
    tracker_type: "sort"
    tracker_params:
      pad_x: 0
      pad_y: 0

  - name: "sort_16"
    tracker_type: "sort"
    tracker_params:
      pad_x: 16
      pad_y: 16

  - name: "sort_32"
    tracker_type: "sort"
    tracker_params:
      pad_x: 32
      pad_y: 32

  - name: "sort_64"
    tracker_type: "sort"
    tracker_params:
      pad_x: 64
      pad_y: 64