extends: "imagenet-vid-yolo-base.yaml"

dataset_params:
  # num_classes : 34 # 34 - Imagenet VID, 21 - VOC, 80 - COCO
  im_size : 320

model_params:
  im_channels : 3
  aspect_ratios : [
    [ 1., 2., 0.5 ],
    [ 1., 2., 3., 0.5, .333 ],
    [ 1., 2., 3., 0.5, .333 ],
    [ 1., 2., 3., 0.5, .333 ],
    [ 1., 2., 0.5 ],
    [ 1., 2., 0.5 ]
  ]
  # scales : [0.2, 0.35, 0.5, 0.65, 0.8, 0.95]
  scales : [0.1, 0.2, 0.375, 0.55, 0.725, 0.9]
  iou_threshold : 0.5
  low_score_threshold : 0.01
  neg_pos_ratio : 3
  pre_nms_topK : 400
  detections_per_img : 200
  nms_threshold : 0.45

train_params:
  model: 'roissd-mobilenet'
  model_label_space: 'yolo-imagenet-vid'  # 'coco', 'image-net', 'imagenet-vid-yolo13' or 'voc' - determines how labels are remapped during training and inference
  roi_mixed_stage: 3
  roi_sampling:
    stage2:
      full_probability: 0.50
      min_crop_side: 96
      aspect_ratio_range: [0.5, 2.0]
      center_jitter_ratio: 0.15
      reference_min_visibility: 0.90
      other_box_min_visibility: 0.30
      max_resample_attempts: 30
      roi_area_fraction_bins:
        - [0.10, 0.25, 0.05]
        - [0.25, 0.50, 0.15]
        - [0.50, 0.75, 0.35]
        - [0.75, 1.00, 0.45]
    stage3:
      full_probability: 0.30
      min_crop_side: 32
      aspect_ratio_range: [0.5, 2.0]
      center_jitter_ratio: 0.25
      reference_min_visibility: 0.80
      other_box_min_visibility: 0.30
      max_resample_attempts: 30
      roi_area_fraction_bins:
        - [0.10, 0.25, 0.25]
        - [0.25, 0.50, 0.35]
        - [0.50, 0.75, 0.25]
        - [0.75, 1.00, 0.15]
  seed: 856245
  acc_steps: 3
  num_epochs: 130
  num_epochs_stage2: 30
  num_epochs_stage3: 30
  batch_size: 20 # 20 for MobileNet, 12-16 for VGG16
  lr_steps: [ 60, 80, 100, 115 ]
  lr_steps_stage2: [ 5, 15 ]
  lr_steps_stage3: [ 10, 15 ]
  lr: 0.00025
  freeze_backbone_bn: true
  freeze_extra_bn: true
  train_bn_affine: true
  log_steps : 100
  task_name: 'imagenet-vid-roissd-mobilenet-20261027/stage3'
  ckpt_name: 'init.pt'
