# Batch tracker sweep for tools.benchmarks.batch_benchmark_vid
# Base benchmark config (model, dataset, output path) is passed via CLI.

sweep_name: "adaptive_tau"

experiments:
  # Optional per-experiment top-level overrides (shorthand for benchmark_vid_params):
  # inference:
  #   key_frame_interval: 10
  #   nms_iou: 0.5
  # roi_merge:
  #   strategy: "greedy"   # Options: greedy | simple | simple_v2 | none
  #   tau: 225677
  #   adaptive_tau: false
  #   adaptive_tau_window_size: 100
  #   adaptive_tau_min_samples: 30
  #   adaptive_tau_min_fullframe_samples: 3
  #   adaptive_tau_min_area_span_ratio: 3.0
  #   adaptive_tau_alpha: 0.1
  #   adaptive_tau_log_every_frames: 100
  #   adaptive_tau_min: 1200
  #   adaptive_tau_max: 20000

  - name: "sort_16_ada_tau"
    tracker_type: "sort"
    tracker_params:
      pad_x: 16
      pad_y: 16
    inference: 
      key_frame_interval: 10
      nms_iou: 0.5
    roi_merge:
      strategy: "greedy"
      tau: 17000
      adaptive_tau: True
      adaptive_tau_window_size: 600
      adaptive_tau_min_samples: 60
      adaptive_tau_min_fullframe_samples: 30
      adaptive_tau_min_area_span_ratio: 5.0
      adaptive_tau_alpha: 0.1
      adaptive_tau_log_every_frames: 100
      adaptive_tau_min: 1000
      adaptive_tau_max: 60000

  # - name: "kalman_16_ada_tau"
  #   tracker_type: "kalman"
  #   tracker_params:
  #     pmin: 16
  #   inference: 
  #     key_frame_interval: 10
  #     nms_iou: 0.5
  #   roi_merge:
  #     strategy: "greedy"
  #     tau: 17000
  #     adaptive_tau: True
  #     adaptive_tau_window_size: 300
  #     adaptive_tau_min_samples: 60
  #     adaptive_tau_min_fullframe_samples: 30
  #     adaptive_tau_min_area_span_ratio: 10.0
  #     adaptive_tau_alpha: 0.1
  #     adaptive_tau_log_every_frames: 100
  #     adaptive_tau_min: 1000
  #     adaptive_tau_max: 25000

  - name: "static_pad_16_ada_tau"
    tracker_type: "static_padding"
    tracker_params:
      pad_x: 16
      pad_y: 16
    inference: 
      key_frame_interval: 10
      nms_iou: 0.5
    roi_merge:
      strategy: "greedy"
      tau: 17000
      adaptive_tau: True
      adaptive_tau_window_size: 600
      adaptive_tau_min_samples: 60
      adaptive_tau_min_fullframe_samples: 30
      adaptive_tau_min_area_span_ratio: 5.0
      adaptive_tau_alpha: 0.1
      adaptive_tau_log_every_frames: 100
      adaptive_tau_min: 1000
      adaptive_tau_max: 60000
